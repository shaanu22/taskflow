# k8s/base/postgres/pvc.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # k3s's local-path-provisioner handles this automatically —
  # no need to manually create a PersistentVolume like on bare Kubernetes