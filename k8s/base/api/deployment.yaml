apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  labels:
    app: taskflow
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
      component: api
  template:
    metadata:
      labels:
        app: taskflow
        component: api
    spec:
      containers:
        - name: api
          image: taskflow-api:local
          imagePullPolicy: Never    # Use the locally imported image
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: taskflow-api-config
            - secretRef:
                name: taskflow-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"