apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-redis
  labels:
    app: taskflow
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      component: redis
  template:
    metadata:
      labels:
        app: taskflow
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-redis-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"