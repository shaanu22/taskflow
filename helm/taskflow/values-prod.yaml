# Production overrides — only what differs from values.yaml

global:
  environment: production

image:
  api:
    pullPolicy: Always
  frontend:
    pullPolicy: Always

api:
  replicaCount: 5
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  config:
    nodeEnv: production
    logLevel: warn

frontend:
  replicaCount: 3
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

postgres:
  storage: 50Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

ingress:
  enabled: true
  className: nginx

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
