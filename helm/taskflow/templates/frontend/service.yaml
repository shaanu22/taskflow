apiVersion: v1
kind: Service
metadata:
  name: taskflow-frontend
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    component: frontend
spec:
  selector:
    {{- include "taskflow.selectorLabels" . | nindent 4 }}
    component: frontend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
