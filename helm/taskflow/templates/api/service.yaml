apiVersion: v1
kind: Service
metadata:
  name: taskflow-api
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    component: api
spec:
  selector:
    {{- include "taskflow.selectorLabels" . | nindent 4 }}
    component: api
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
